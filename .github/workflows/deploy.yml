name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Only changes that can alter the image or the deployment restart the bridge.
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/ci.yml"

# Secrets of the production environment (limited to main): DEPLOY_HOST, DEPLOY_SSH_KEY,
# DEPLOY_KNOWN_HOSTS. Variable of the environment: DEPLOY_USER.
# config.yaml and .env live only on the host and are never written by this workflow.

env:
  IMAGE: ghcr.io/vsem-azamat/wa-tg-mirror

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tag
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.tag.outputs.value }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      SSH_TARGET: ${{ vars.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      DEPLOY_DIR: deploy/wa-tg-mirror
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          for v in DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_HOST; do
            test -n "${!v}" || { echo "FATAL: $v is required" >&2; exit 1; }
          done
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' 'Host *' '  StrictHostKeyChecking yes' '  BatchMode yes' '  IdentitiesOnly yes' > ~/.ssh/config

      - name: Ship compose file and image tag
        env:
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          # The data directory, config.yaml and .env are prepared on the host once (docs/operation.md).
          ssh "$SSH_TARGET" "test -d ~/$DEPLOY_DIR/data && test -f ~/$DEPLOY_DIR/config.yaml && test -f ~/$DEPLOY_DIR/.env"
          scp deploy/compose.yaml "$SSH_TARGET:$DEPLOY_DIR/compose.yaml"
          printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" | ssh "$SSH_TARGET" "cat > ~/$DEPLOY_DIR/image.env"

      - name: Pull and restart
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The script travels as the remote command and the pull token on stdin, so the
          # token never appears on a command line on the host.
          script=$(cat <<'REMOTE'
          set -euo pipefail
          read -r token
          cd ~/"$DEPLOY_DIR"
          # Throwaway docker config: the short-lived token is not kept on the host.
          export DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s\n' "$token" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin >/dev/null
          docker compose --env-file image.env pull
          # On failure show the container state only: the run log is public, the app log is not.
          docker compose --env-file image.env up -d --remove-orphans --wait --wait-timeout 180 || {
            docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} restarts={{.RestartCount}}' \
              $(docker compose --env-file image.env ps -aq)
            exit 1
          }
          docker compose --env-file image.env ps
          # Drop this project's older image tags; other projects share the host.
          current="ghcr.io/vsem-azamat/wa-tg-mirror:$(sed -n 's/^IMAGE_TAG=//p' image.env)"
          docker images ghcr.io/vsem-azamat/wa-tg-mirror --format '{{.Repository}}:{{.Tag}}' |
            grep -vx "$current" | xargs -r docker rmi >/dev/null || true
          docker image prune -f >/dev/null
          REMOTE
          )
          printf '%s\n' "$GHCR_PULL_TOKEN" |
            ssh "$SSH_TARGET" "DEPLOY_DIR=$(printf %q "$DEPLOY_DIR") GHCR_USERNAME=$(printf %q "$GHCR_USERNAME") bash -c $(printf %q "$script")"
